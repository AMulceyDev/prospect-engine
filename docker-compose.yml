services:
  backend-development:
    build:
      context: ./backend
      target: development
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    networks:
      - prospect
      - prospect-backend

  backend-production:
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    networks:
      - prospect
      - prospect-backend

  worker-development:
    build:
      context: ./backend
      target: development
    command: npm run start:worker:dev
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - prospect
      - prospect-backend

  worker-production:
    build:
      context: ./backend
      target: production
    command: node dist/worker.js
    env_file:
      - ./backend/.env
    networks:
      - prospect
      - prospect-backend

  database:
    image: postgres:17-alpine
    env_file:
      - ./backend/.env
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - prospect-backend

  redis:
    image: redis:7-alpine
    networks:
      - prospect-backend

networks:
  prospect:
    external: true
  prospect-backend:
    driver: bridge

volumes:
  db-data: