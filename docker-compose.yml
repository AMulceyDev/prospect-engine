services:
  database:
    image: postgres:16
    container_name: prospect-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prospect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prospect"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: prospect-api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - /app/.venv
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/prospect
    depends_on:
      database:
        condition: service_healthy

volumes:
  pgdata: